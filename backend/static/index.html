<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Crop Disease Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-top: #e8fbe5;
        --bg-bottom: #f0f7e6;
        --panel: rgba(255, 255, 255, 0.82);
        --panel-solid: #ffffff;
        --ink: #0f1f17;
        --muted: #4a6654;
        --line: #c8ddc6;
        --accent: #16a34a;
        --accent-dark: #15803d;
        --accent-glow: rgba(22, 163, 74, 0.25);
        --warn: #c2410c;
        --radius: 16px;
        --shadow-sm: 0 2px 8px rgba(0,40,15,0.06);
        --shadow-md: 0 8px 30px rgba(0,40,15,0.1);
        --shadow-lg: 0 20px 50px rgba(0,40,15,0.12);
      }

      @keyframes bgShift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.04); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        color: var(--ink);
        min-height: 100vh;
        background:
          radial-gradient(ellipse at 10% 0%, rgba(167,243,180,0.45) 0%, transparent 50%),
          radial-gradient(ellipse at 90% 5%, rgba(134,239,172,0.3) 0%, transparent 40%),
          radial-gradient(ellipse at 50% 100%, rgba(187,247,208,0.3) 0%, transparent 50%),
          linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
        background-size: 200% 200%;
        animation: bgShift 18s ease infinite;
      }

      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px 18px 40px;
      }

      /* ── Glass card base ── */
      .hero, .card {
        border: 1px solid rgba(200, 221, 198, 0.6);
        border-radius: var(--radius);
        background: var(--panel);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: var(--shadow-md);
        animation: fadeUp 0.5s ease both;
      }

      /* ── Hero ── */
      .hero {
        padding: 28px 30px;
        margin-bottom: 18px;
        position: relative;
        overflow: hidden;
        animation-delay: 0.05s;
      }
      .hero::before {
        content: '🌿';
        position: absolute;
        right: 24px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 54px;
        opacity: 0.18;
        pointer-events: none;
      }

      h1 {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #166534, #16a34a);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14.5px;
        line-height: 1.5;
      }

      /* ── Chips ── */
      .chips { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
      .chip {
        border: 1px solid #bbf7d0;
        background: linear-gradient(135deg, #f0fdf4, #dcfce7);
        color: #166534;
        border-radius: 999px;
        padding: 5px 14px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        transition: all 0.25s ease;
        cursor: default;
      }
      .chip:hover {
        background: linear-gradient(135deg, #dcfce7, #bbf7d0);
        transform: translateY(-1px);
        box-shadow: 0 3px 10px rgba(22,163,74,0.15);
      }

      /* ── Card ── */
      .card {
        padding: 24px 26px;
        animation-delay: 0.15s;
      }

      /* ── Grid & Form ── */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }
      label {
        display: block;
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 600;
        color: #365942;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      input, select {
        width: 100%;
        border-radius: 10px;
        border: 1.5px solid var(--line);
        padding: 10px 14px;
        font-size: 14px;
        font-family: inherit;
        background: rgba(255,255,255,0.7);
        transition: all 0.25s ease;
        color: var(--ink);
      }
      input:focus, select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
        background: #fff;
      }
      input::placeholder { color: #94b8a0; }

      /* ── Buttons ── */
      button {
        width: 100%;
        border-radius: 10px;
        border: none;
        padding: 11px 16px;
        font-size: 14px;
        font-family: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.25s ease;
        letter-spacing: 0.2px;
      }
      .btn-row {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
      }
      .btn-primary {
        background: linear-gradient(135deg, #16a34a, #15803d);
        color: #fff;
        box-shadow: 0 4px 14px var(--accent-glow);
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #15803d, #166534);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px var(--accent-glow);
      }
      .btn-primary:active { transform: translateY(0); }
      .btn-secondary {
        background: rgba(220,252,231,0.5);
        color: #166534;
        border: 1.5px solid #bbf7d0;
      }
      .btn-secondary:hover {
        background: rgba(187,247,208,0.5);
        transform: translateY(-1px);
      }
      .btn-secondary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none !important;
      }

      /* ── Preview ── */
      .preview { margin-top: 16px; display: none; }
      .preview img {
        width: 100%;
        max-height: 300px;
        object-fit: cover;
        border-radius: 14px;
        border: 1.5px solid var(--line);
        box-shadow: var(--shadow-sm);
        transition: transform 0.3s ease;
      }
      .preview img:hover { transform: scale(1.01); }

      /* ── Result ── */
      .result {
        display: none;
        margin-top: 18px;
        border: 1.5px solid var(--line);
        border-radius: 14px;
        padding: 20px;
        background: rgba(253, 254, 253, 0.85);
        backdrop-filter: blur(8px);
        animation: fadeUp 0.4s ease both;
      }
      .result h2 {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
        color: #14532d;
      }
      .badge {
        display: inline-block;
        margin-left: 10px;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        background: linear-gradient(135deg, #dcfce7, #bbf7d0);
        color: #166534;
        vertical-align: middle;
      }
      .warn {
        color: var(--warn);
        font-weight: 700;
        font-size: 13.5px;
        background: #fff7ed;
        border: 1px solid #fed7aa;
        border-radius: 8px;
        padding: 8px 12px;
        margin-top: 8px;
      }
      .muted { color: var(--muted); }

      /* ── Sub grid / cards ── */
      .subgrid {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
      }
      .subcard {
        border: 1.5px solid #e2efe0;
        border-radius: 12px;
        padding: 14px;
        background: rgba(240,253,244,0.5);
        transition: box-shadow 0.25s ease;
      }
      .subcard:hover {
        box-shadow: var(--shadow-sm);
      }
      .subcard p { font-size: 13.5px; }

      /* ── Top predictions ── */
      .top3 {
        margin-top: 10px;
        border-radius: 10px;
        padding: 12px 14px;
        background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
        border: 1px solid #d1fae5;
      }
      .top3 strong { font-size: 13px; color: #14532d; }
      .top3 div { font-size: 13px; padding: 2px 0; }

      /* ── Lists ── */
      ul {
        margin: 8px 0 0;
        padding-left: 20px;
      }
      li {
        font-size: 13.5px;
        line-height: 1.7;
        color: #365942;
      }

      /* ── Loading spinner ── */
      .loading-indicator {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 14px;
        padding: 8px 0;
      }
      .loading-indicator::before {
        content: '';
        width: 20px; height: 20px;
        border: 2.5px solid #d1fae5;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }

      /* ── Footer ── */
      .footer {
        text-align: center;
        margin-top: 28px;
        padding: 12px;
        font-size: 12px;
        color: #7c9e85;
        letter-spacing: 0.3px;
      }

      /* ── Responsive ── */
      @media (max-width: 640px) {
        h1 { font-size: 24px; }
        .hero { padding: 20px; }
        .card { padding: 18px; }
        .hero::before { font-size: 40px; right: 14px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- Hero Card: project title and supported crop badges -->
      <section class="hero">
        <h1>Smart Crop Disease Detection</h1>
        <p>
          Upload a leaf image and get instant prediction, confidence, and treatment guidance.
        </p>
        <div class="chips">
          <span class="chip">Tomato</span>
          <span class="chip">Potato</span>
          <span class="chip">Maize</span>
        </div>
      </section>

      <!-- Main Form Card: upload and prediction controls -->
      <section class="card">
        <form id="predictForm">
          <div class="grid">
            <div>
              <label for="farmerId">Farmer ID</label>
              <input type="text" id="farmerId" placeholder="e.g. farmer-001" />
            </div>
            <div>
              <label for="crop">Crop</label>
              <select id="crop">
                <option value="tomato">Tomato</option>
                <option value="potato">Potato</option>
                <option value="maize">Maize</option>
              </select>
            </div>
            <div>
              <label for="lang">Language</label>
              <select id="lang">
                <option value="en">English</option>
                <option value="ur">Urdu</option>
              </select>
            </div>
            <div>
              <label for="latitude">Latitude (optional)</label>
              <input type="text" id="latitude" placeholder="e.g. 31.5204" />
            </div>
            <div>
              <label for="longitude">Longitude (optional)</label>
              <input type="text" id="longitude" placeholder="e.g. 74.3587" />
            </div>
            <div>
              <label for="image">Leaf image</label>
              <input type="file" id="image" accept="image/*" required />
            </div>
          </div>
          <div class="btn-row">
            <button class="btn-primary" type="submit">Detect Disease</button>
            <button class="btn-secondary" type="button" id="resetBtn">Search Again</button>
            <button class="btn-secondary" type="button" id="downloadBtn" disabled>Download Result</button>
          </div>
        </form>

        <!-- Preview Card: selected leaf image before analysis -->
        <div class="preview" id="preview">
          <img id="previewImg" alt="Uploaded leaf preview" />
        </div>

        <!-- Result Card: disease, confidence, treatment and weather -->
        <div class="result" id="resultCard"></div>
      </section>
      <div class="footer">🌱 Smart Crop Disease Detection &mdash; AI-Powered Agriculture</div>
    </div>

    <script>
      const form = document.getElementById("predictForm");
      const resultCard = document.getElementById("resultCard");
      const resetBtn = document.getElementById("resetBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const imageInput = document.getElementById("image");
      const preview = document.getElementById("preview");
      const previewImg = document.getElementById("previewImg");

      let latestResult = null;

      const asList = (arr) => `<ul>${(arr || []).map((item) => `<li>${item}</li>`).join("")}</ul>`;

      const toPercent = (value) => `${(Number(value || 0) * 100).toFixed(2)}%`;

      // Reset the form to a fresh "new search" state.
      const resetView = () => {
        form.reset();
        resultCard.style.display = "none";
        resultCard.innerHTML = "";
        latestResult = null;
        downloadBtn.disabled = true;
        preview.style.display = "none";
        previewImg.src = "";
      };

      // Export latest prediction details as a text report.
      const downloadResult = () => {
        if (!latestResult) return;
        const lines = [
          `Disease: ${latestResult.disease_name}`,
          `Confidence: ${toPercent(latestResult.confidence)}`,
          `Detected Crop: ${latestResult.crop_name}`,
          `Pesticide: ${latestResult.recommendation?.pesticide ?? ""}`,
          `Dosage: ${latestResult.recommendation?.dosage ?? ""}`,
          "",
          "Treatment Steps:",
          ...(latestResult.recommendation?.treatment_steps ?? []).map((s) => `- ${s}`),
          "",
          "Prevention Tips:",
          ...(latestResult.recommendation?.prevention_tips ?? []).map((s) => `- ${s}`),
          "",
          `Weather Risk: ${latestResult.weather_risk?.risk_level ?? "unknown"}`,
          `Weather Note: ${latestResult.weather_risk?.message ?? ""}`,
          latestResult.warning ? `Warning: ${latestResult.warning}` : "",
        ];

        const text = lines.filter(Boolean).join("\n");
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `prediction-${new Date().toISOString().replace(/[:.]/g, "-")}.txt`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      };

      imageInput.addEventListener("change", () => {
        const file = imageInput.files && imageInput.files[0];
        if (!file) {
          preview.style.display = "none";
          previewImg.src = "";
          return;
        }
        previewImg.src = URL.createObjectURL(file);
        preview.style.display = "block";
      });

      resetBtn.addEventListener("click", resetView);
      downloadBtn.addEventListener("click", downloadResult);

      // Main submit flow: upload image, call API, render cards.
      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const image = imageInput.files && imageInput.files[0];
        if (!image) {
          resultCard.style.display = "block";
          resultCard.innerHTML = `<p class="warn">Please choose a leaf image.</p>`;
          return;
        }

        const formData = new FormData();
        formData.append("image", image);
        formData.append("farmer_id", document.getElementById("farmerId").value || "anonymous");
        formData.append("crop", document.getElementById("crop").value || "tomato");
        formData.append("lang", document.getElementById("lang").value || "en");
        formData.append("latitude", document.getElementById("latitude").value || "");
        formData.append("longitude", document.getElementById("longitude").value || "");

        resultCard.style.display = "block";
        resultCard.innerHTML = "<div class='loading-indicator'>Analyzing image… please wait</div>";

        try {
          const response = await fetch("/api/predict", {
            method: "POST",
            body: formData,
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Prediction failed.");
          }

          latestResult = data;
          downloadBtn.disabled = false;

          const weather = data.weather_risk || {};
          const top3 = (data.top_predictions || [])
            .map((item) => `<div>${item.disease_key}: <strong>${toPercent(item.confidence)}</strong></div>`)
            .join("");

          resultCard.innerHTML = `
            <h2>${data.disease_name}<span class="badge">${toPercent(data.confidence)}</span></h2>
            <p><strong>Crop:</strong> ${data.crop_name}</p>
            ${data.warning ? `<p class="warn">${data.warning}</p>` : ""}
            <div class="top3"><strong>Top predictions</strong>${top3 || "<div>No alternatives available.</div>"}</div>
            <div class="subgrid">
              <div class="subcard">
                <p><strong>Pesticide:</strong> ${data.recommendation.pesticide}</p>
                <p><strong>Dosage:</strong> ${data.recommendation.dosage}</p>
              </div>
              <div class="subcard">
                <p><strong>Weather risk:</strong> ${weather.risk_level || "unknown"}</p>
                <p class="muted">${weather.message || ""}</p>
              </div>
            </div>
            <p><strong>Treatment steps:</strong></p>
            ${asList(data.recommendation.treatment_steps)}
            <p><strong>Prevention tips:</strong></p>
            ${asList(data.recommendation.prevention_tips)}
          `;
        } catch (error) {
          latestResult = null;
          downloadBtn.disabled = true;
          resultCard.innerHTML = `<p class="warn"><strong>Error:</strong> ${error.message}</p>`;
        }
      });
    </script>
  </body>
</html>
